    <style>
      /* Styling Only Related To THIS Page */
      .parent-flex {
        display: flex;
        background-color: rgb(96, 142, 81);
        align-items: center;
        justify-content: space-around;
        margin-bottom: 50px;
      }

      .parent-flex img {
        width: 150px;
        padding: 20px;
      }
      .child-flex p {
        background-color: rgb(254, 254, 149);
        padding: 20px;
        margin: 20px;
      }
       /* Styling Only Related To THIS Page */
      #horizontal-photo-div {
        display: flex;
        justify-content: center;
        align-content: space-around;
        flex-wrap: wrap;
      }

      #horizontal-photo-div img {
        height: 380px;
        width: 550px;
        object-fit: cover;
        margin: 20px;
        opacity: 1;
      }


      #vertical-photo-div {
        display: flex;
        justify-content: center;
        align-content: space-around;
        flex-wrap: wrap;
      }

      #vertical-photo-div img {
        width: 350px;
        height: 500px;
        object-fit: cover;
        margin: 20px;
        opacity: 1;
      }

      #vertical-photo-div img:hover {
        opacity: 0.4;
      }
      
/* horizontal photos */
      .image {
        position:relative;
        height: 380px;
        width: 550px;
        object-fit: cover;
        margin: 20px;
        
      }
      
      .image-img {
        display: block;
        width: 100%;
      }
      
      .image-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        margin: 20px;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.25s;
      }
      
      .image-overlay:hover {
        opacity: 1;
      }
      
      .image-location {
        font-size: 2em;
        font-weight: bold;
        text-align: center;
      }
      
      .image-camera {
        font-size: 1.2em;
        margin-top: 0.25em;
        text-align: center;
      }
/* vertical photos */
      .image-v {
        position:relative;
        width: 350px;
        height: 500px;
        object-fit: cover;
        margin: 20px;
        
      }
      
    </style>

    </style>
